{% if site.url and site.url != "" and site.url != "http://localhost:4000" %}
  <!-- Safe Production Link Block -->
  <div class="production-link-banner" style="margin-bottom: 1.5rem; text-align: right;">
    <a href="{{ site.url }}{{ site.baseurl }}{{ page.url }}"

{% endif %}
