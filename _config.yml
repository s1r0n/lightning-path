title: The Lightning Path
description: Bringing the new world to life
remote_theme: just-the-docs/just-the-docs

# Combine all plugins into ONE plugins block
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

just_the_docs:
  custom_css:
    - "assets/css/custom.css"

ga_tracking: G-01E78G6G28
ga_tracking_anonymize_ip: true

aux_links:
  "Avatar.GLOBAL": "/coming-soon"
  "The SpiritWiki": "https://spiritwiki.lightningpath.org/"

aux_links_new_tab: false
heading_anchors: true
nav_enabled: true

# CRITICAL FIX: Set this to your custom domain
url: "https://repo.lightningpath.org"
baseurl: ""  # leave empty since your site is at the root of the domain

webrick:
  headers:
    'Access-Control-Allow-Origin': '*'
    'Access-Control-Allow-Methods': 'GET, OPTIONS, HEAD'

mermaid:
  version: "11.6.0"

search_enabled: true
color_scheme: light

footer_content: "Copyright © 2025 Avatar.GLOBAL. License."

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: false
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/s1r0n/lightning-path"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"
